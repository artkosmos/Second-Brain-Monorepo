[project]
name = "second-brain-api"
version = "0.1.0"
description = "Second Brain notes API"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "sqlalchemy>=2.1.5",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=1.15",
    "pre-commit>=4",
    "pytest>=9.1.1",
    "pytest-postgresql>=9.1.1",
    "ruff>=0.11",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 88
src = [".", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"alembic/versions/**" = ["E501", "I001"]

[tool.mypy]
strict = true
python_version = "3.14"
plugins = ["pydantic.mypy"]
files = [
    "main.py",
    "config",
    "db",
    "dependencies",
    "exceptions",
    "models",
    "repositories",
    "routers",
    "schemas",
    "security",
    "utils",
    "alembic/env.py",
    "tests",
]
exclude = ["alembic/versions/"]